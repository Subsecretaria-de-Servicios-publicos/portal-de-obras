<div>
  <div class="row" ng-show='obras'>
    <div class="col-xs-6">
      <h1 class="center ">{{ i18n.homeTitle }}</h1>
    </div>
    <div class="col-xs-6">
      <img src="images/fechaActualizacion.png" width="300px" style="padding-top:30px;float:right;display: block;">
    </div>

  </div>
  <div id='stats-home' class="row" ng-show='obras'>
    <div class="col-xs-12">
      <div class='row'>
        <div class='col-xs-4'>
          <div class="row">
            <div class='col-xs-3 col-md-4 icon-container'>
              <img class="" src="images/indicadores/inversion.svg" />
            </div>
            <div class='col-xs-9 col-md-8 value-container'>
              <h5>{{ i18n.investmentAmount }}:</h5>
              <span class="value">{{totalRender.inversion | currency:$ :0}}</span>
            </div>
          </div>
        </div>
        <div class='col-xs-4'>
          <div class="row">
            <div class='col-xs-3 col-md-4 icon-container'>
              <img class="" src="images/indicadores/obras.svg" />
            </div>
            <div class='col-xs-9 col-md-8 value-container'>
              <h5>{{ i18n.totalWorks }}:</h5>
              <span class="value">{{totalRender.obras | number:0}}</span>
            </div>
          </div>
        </div>
        <div class='col-xs-4'>
          <div class="row">
            <div class='col-xs-3 col-md-4 icon-container'>
              <img class="" src="images/indicadores/finalizadas.svg" />
            </div>
            <div class='col-xs-9 col-md-8 value-container'>
              <h5>{{ i18n.ended }}:</h5>
              <span class="value">{{(totalRender.porcentaje_finalizadas *100) / totalRender.obras| number:0}}%</span>
              <!--
              <span class="value">{{(totalRender.porcentaje_enejecucion *100) / totalRender.obras| number:0}}%</span>
              <span class="value">{{(totalRender.porcentaje_enlicitacion *100) / totalRender.obras| number:0}}%</span>
              <span class="value">{{(totalRender.porcentaje_enproyecto *100) / totalRender.obras| number:0}}%</span>
              -->

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
